<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aplikasi nilai siswa</title>
    <link rel="stylesheet" href="style.css">
</head>
    <body>
        <div class="container">
            <h2>Daftar Nilai Siswa Kelas X RPL 2</h2>
            <p>Silakan buka <b>inspect -> console</b> untuk melihat output JS.</p>
        
            <h3>1. Data siswa</h3>
            <ul id="semua-siswa"></ul>

            <h3>2. Siswa yang Lulus</h3>
            <ul id="siswa-lulus"></ul>

            <h3>3. Array nama siswa</h3>
            <div class="alert-info" id="nama-siswa"></div>

            <h3>4. Siswa pertama dengan Nilai Minimal 90</h3>
            <p id="siswa-tinggi"></p>

            <h3>5. Rata-rata nilai Kelas</h3>
            <p id="rata-rata"></p>
        </div>

<script src="script.js"></script>
    </body>
</html>
